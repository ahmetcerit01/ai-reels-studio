<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 Animasyon Stili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#06070c; --ink:#f5efe9; --dim:rgba(245,239,233,.42); --copper:#e8875c; --copper2:#f2a679; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1080px;height:1920px;background:var(--bg);overflow:hidden;transform-origin:center center;flex:none;font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;width:1080px;height:1920px}
.head{position:absolute;left:0;right:0;top:232px;text-align:center}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--copper);font:700 34px/1 'Inter',sans-serif;letter-spacing:.24em}
.eyebrow svg{width:34px;height:34px}
h1{margin-top:30px;font:900 98px/1 'Inter Tight',sans-serif;letter-spacing:-.035em;color:var(--ink);white-space:nowrap}
h1 em{font:italic 400 118px/1 'Instrument Serif',serif;letter-spacing:-.01em;background:linear-gradient(180deg,#f6b48b,#d7764b);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:8px}
.sub{margin-top:36px;font:600 29px/1 'Inter',sans-serif;letter-spacing:.2em;color:rgba(245,239,233,.72)}
.headB{opacity:0}
#list{position:absolute;left:92px;top:632px;width:420px}
.it{position:relative;height:72px;display:flex;align-items:center;gap:30px;font:600 36px/1 'Inter',sans-serif;letter-spacing:-.02em}
.it .n{width:62px;font:700 33px/1 'Inter',sans-serif;color:rgba(245,239,233,.32);letter-spacing:.02em}
.it .t{color:var(--dim);opacity:0;white-space:nowrap}
.it .bar{position:absolute;left:-22px;top:17px;width:5px;height:38px;border-radius:3px;background:var(--copper);opacity:0}
.it.on .n{color:var(--copper)}
.it.on .t{color:#fff;font-weight:800}
.it.on .bar{opacity:1}
#phone{position:absolute;left:506px;top:556px;width:500px;height:800px;border-radius:38px;overflow:hidden;border:2px solid rgba(255,255,255,.14);background:#000}
#phone canvas{width:500px;height:800px;display:block}
#glow{position:absolute;left:446px;top:500px;width:620px;height:912px;border-radius:80px;filter:blur(60px);opacity:.5}
#scene2{position:absolute;inset:0;opacity:0;pointer-events:none}
#grid{position:absolute;left:0;right:0;top:560px;height:820px}
.cell{position:absolute;width:200px;height:258px;border-radius:20px;overflow:hidden;border:2px solid rgba(255,255,255,.16);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.cell canvas{width:200px;height:258px;display:block}
.cell span{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;font:700 19px/1 'Inter',sans-serif;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.78));white-space:nowrap;letter-spacing:-.01em}
.cell span b{color:var(--copper2);margin-right:6px}
#pill{position:absolute;left:50%;top:1404px;transform:translateX(-50%);height:96px;padding:0 24px 0 18px;display:flex;align-items:center;gap:16px;border-radius:60px;background:rgba(255,255,255,.045);border:2px solid rgba(255,255,255,.09);white-space:nowrap;font:800 36px/1 'Inter',sans-serif;letter-spacing:-.025em;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#3a3d48,#22242c);display:flex;align-items:center;justify-content:center}
.av svg{width:34px;height:34px}
#pill .w{color:#fff} #pill .c{color:var(--copper)} #pill .g{color:rgba(245,239,233,.55)}
#pill .tw{display:inline-block;min-width:168px}
#cursor{display:inline-block;width:4px;height:38px;background:#fff;margin:0 2px -6px;border-radius:2px}
#pill .send{margin-left:4px;color:#4aa3ff;font-weight:700;font-size:30px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="glow"></div>
  <div class="head headA">
    <div class="eyebrow"><svg viewBox="0 0 24 24" fill="#e8875c"><path class="spark" d=""/></svg>CLAUDE İLE</div>
    <h1>9 ANİMASYON <em>stili</em></h1>
    <div class="sub">ANLATIM VİDEOLARI İÇİN 9 TARZ</div>
  </div>
  <div class="head headB">
    <div class="eyebrow"><svg viewBox="0 0 24 24" fill="#e8875c"><path class="spark" d=""/></svg>CLAUDE İLE</div>
    <h1>9 PROMPT <em>hazır</em></h1>
    <div class="sub">YORUMLARA “STİLLER” YAZ</div>
  </div>
  <div id="scene1">
    <div id="list"></div>
    <div id="phone"><canvas id="cv" width="1000" height="1600"></canvas></div>
  </div>
  <div id="scene2"><div id="grid"></div></div>
  <div id="pill">
    <div class="av"><svg viewBox="0 0 24 24" fill="rgba(255,255,255,.7)"><circle cx="12" cy="9" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6z"/></svg></div>
    <span class="w">Yorumlara</span><span class="tw"><span class="c" id="typed">STİLLER</span><span id="cursor"></span></span><span class="w">yaz,</span><span class="g">prompt DM'de</span>
    <span class="send">Gönder</span>
  </div>
</div>

<script>
const W = 500, H = 800, TAU = Math.PI*2;
const STYLES = ['İzometrik','Kâğıt Kesme','3D Veri Grafiği','Synthwave','3D Anlatım','Matematik','Çizgi Film Anlatım','Domino Yazı','Parlayan Atom'];
const ACCENT = ['#e9d8b4','#6f8fd6','#f0a35e','#ff3cac','#c9d6ff','#e8875c','#e2553b','#d4492f','#f2b14a'];
const TOTAL = 18, S0 = 0, D = 1.5, S2 = S0 + D*9; // 13.5

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = x => 1 - Math.pow(1 - clamp(x,0,1), 3);
const easeIO = x => { x = clamp(x,0,1); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; };
const back = x => { x = clamp(x,0,1); const c1 = 1.9, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
function lin(c, y0, y1, stops){ const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach((s,i) => g.addColorStop(i/(stops.length-1), s)); return g; }
function txt(c, s, x, y, font, col, align = 'left'){ c.font = font; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); }

(function(){
  let d = '';
  for (let i = 0; i < 12; i++){ const a = i/12*TAU - Math.PI/2, a1 = a - .32, a2 = a + .32, R = i % 2 ? 9.8 : 11.8;
    d += `M12 12 L${12+Math.cos(a1)*3.2} ${12+Math.sin(a1)*3.2} L${12+Math.cos(a)*R} ${12+Math.sin(a)*R} L${12+Math.cos(a2)*3.2} ${12+Math.sin(a2)*3.2}Z `; }
  document.querySelectorAll('.spark').forEach(p => p.setAttribute('d', d));
})();

const R = [];

/* ---------- 1 İzometrik: veri merkezi ---------- */
function isoP(x, y, z){ const s = 1; return [250 + (x - y)*0.866*s, 430 + (x + y)*0.5*s - z*s]; }
function poly(c, pts, fill, stroke){ c.beginPath(); pts.forEach((p,i) => { const q = isoP(...p); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath(); if (fill){ c.fillStyle = fill; c.fill(); } if (stroke){ c.strokeStyle = stroke; c.lineWidth = 1; c.stroke(); } }
function box(c, x, y, z, w, d, h, top, right, left, stroke){
  poly(c, [[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]], right, stroke);
  poly(c, [[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]], left, stroke);
  poly(c, [[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]], top, stroke);
}
R[0] = (c, t, lt) => {
  c.fillStyle = '#efe6d2'; c.fillRect(0,0,W,H);
  const bob = Math.sin(t*1.2)*3;
  c.save(); c.translate(0, bob);
  // zemin
  box(c, -150, -120, -14, 300, 300, 14, '#f7f1e3', '#d9cdb2', '#e6dcc4');
  // yüzen küpler
  [[-210,-60,0],[190,-200,0],[-60,230,0]].forEach(([x,y],i) => { const z = 40 + Math.sin(t*1.5 + i)*10; box(c, x, y, z, 26, 26, 26, '#fbf7ee', '#ddd2ba', '#ebe3d0'); });
  // kule
  box(c, -230, -230, 0, 34, 34, 120, '#d9e1ea', '#9fb0c2', '#bcc8d6');
  // kablo
  const path = [[-213,-213,120],[-213,-213,4],[-60,-213,4],[-60,-60,4]];
  c.strokeStyle = '#3b7bd8'; c.lineWidth = 3; c.beginPath(); path.forEach((p,i) => { const q = isoP(...p); i ? c.lineTo(...q) : c.moveTo(...q); }); c.stroke();
  // veri darbeleri
  const segs = []; let L = 0; for (let i = 0; i < path.length-1; i++){ const a = path[i], b = path[i+1], l = Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2]); segs.push([a,b,l]); L += l; }
  for (let k = 0; k < 5; k++){ let d = ((t*220 + k*L/5) % L); for (const [a,b,l] of segs){ if (d <= l){ const f = d/l, q = isoP(a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f); c.fillStyle = '#ff8a3d'; c.shadowColor = '#ff8a3d'; c.shadowBlur = 10; c.beginPath(); c.arc(q[0], q[1], 4, 0, TAU); c.fill(); c.shadowBlur = 0; break; } d -= l; } }
  // bina zemini ve raflar
  box(c, -70, -70, 0, 200, 200, 6, '#e8e2d6', '#c9bfab', '#d8cfbd');
  const racks = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) racks.push([-40 + i*55, -30 + j*95]);
  racks.sort((a,b) => (a[0]+a[1]) - (b[0]+b[1])).forEach(([x,y],k) => {
    const hh = 70 * ease((lt - k*0.06)/0.35) || 0.1;
    box(c, x, y, 6, 36, 60, Math.max(1, hh), '#4a5260', '#2b313b', '#383f4b');
    if (hh > 60) for (let r = 0; r < 6; r++){ const on = Math.sin(t*9 + r*1.7 + k) > 0; const q = isoP(x+36, y + 10 + (r%3)*18, 6 + 18 + Math.floor(r/3)*24); c.fillStyle = on ? '#4dff9a' : '#1b6b45'; c.fillRect(q[0]-2, q[1]-2, 4, 3); }
  });
  // cam duvarlar
  c.globalAlpha = .55; poly(c, [[-70,130,6],[130,130,6],[130,130,60],[-70,130,60]], 'rgba(200,220,235,.35)', '#9fb0c2'); poly(c, [[130,-70,6],[130,130,6],[130,130,60],[130,-70,60]], 'rgba(200,220,235,.3)', '#9fb0c2'); c.globalAlpha = 1;
  c.restore();
  // etiketler
  const lab = (s1, s2, x, y, tx, ty) => { c.strokeStyle = '#2b2b2b'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y); c.lineTo(tx, ty); c.stroke(); c.fillStyle = '#2b2b2b'; c.beginPath(); c.arc(x, y, 2.5, 0, TAU); c.fill(); txt(c, s1, tx + 4, ty - 4, '700 13px JetBrains Mono', '#2b2b2b'); if (s2) txt(c, s2, tx + 4, ty + 14, '500 12px JetBrains Mono', '#6b6250'); };
  const a = clamp((lt - 0.3)/0.3, 0, 1); c.globalAlpha = a;
  const p1 = isoP(-213, -150, 4); lab('FİBER OPTİK KABLO', '~200.000 km', p1[0], p1[1] + bob, 60, 170);
  const p2 = isoP(130, 130, 0); lab('VERİ MERKEZİ', '6 sunucu rafı', p2[0], p2[1] + bob, 300, 660);
  c.globalAlpha = 1;
  txt(c, 'İnternet nasıl çalışır?', 28, 64, '800 24px Inter', '#1f1d18'); txt(c, 'Bölüm 1 · Altyapı', 28, 88, '500 14px Inter', '#7a705c');
};

/* ---------- 2 Kâğıt Kesme: deniz feneri ---------- */
function paperShadow(c, on){ if (on){ c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 14; c.shadowOffsetY = -3; } else { c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0; } }
R[1] = (c, t, lt) => {
  c.fillStyle = lin(c, 0, H, ['#16213f','#26365f','#3c5283']); c.fillRect(0,0,W,H);
  const r = rng(6); c.fillStyle = '#f3ead2'; for (let i = 0; i < 40; i++){ const x = r()*W, y = r()*380, s = r()*2 + 1; c.globalAlpha = .5 + .5*Math.abs(Math.sin(t*2 + i)); c.beginPath(); c.arc(x, y, s, 0, TAU); c.fill(); } c.globalAlpha = 1;
  // ay
  const mg = c.createRadialGradient(360, 150, 20, 360, 150, 120); mg.addColorStop(0, 'rgba(255,240,200,.45)'); mg.addColorStop(1, 'rgba(255,240,200,0)'); c.fillStyle = mg; c.fillRect(220, 20, 280, 280);
  paperShadow(c, true); c.fillStyle = '#f6eccf'; c.beginPath(); c.arc(360, 150, 46, 0, TAU); c.fill();
  // bulutlar
  [[80,120,1],[300,240,.8],[460,90,.7]].forEach(([x,y,s],i) => { const xx = ((x - t*12*(i+1)) % 640 + 640) % 640 - 70; c.fillStyle = '#c9d2e6'; c.beginPath(); c.ellipse(xx, y, 54*s, 14*s, 0, 0, TAU); c.ellipse(xx + 20*s, y - 10*s, 30*s, 14*s, 0, 0, TAU); c.fill(); });
  // ışık hüzmesi
  paperShadow(c, false);
  const lx = 120, ly = 300, sw = Math.cos(t*1.6);
  c.save(); c.globalCompositeOperation = 'lighter'; const bg = c.createLinearGradient(lx, ly, lx + 420*sw, ly); bg.addColorStop(0, 'rgba(255,240,180,.55)'); bg.addColorStop(1, 'rgba(255,240,180,0)'); c.fillStyle = bg;
  c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx + 420*sw, ly - 60); c.lineTo(lx + 420*sw, ly + 50); c.closePath(); c.fill(); c.restore();
  // uçurum + fener
  paperShadow(c, true);
  c.fillStyle = '#1b2440'; c.beginPath(); c.moveTo(0, 420); c.lineTo(60, 400); c.lineTo(150, 392); c.lineTo(190, 430); c.lineTo(230, 520); c.lineTo(0, 560); c.fill();
  c.fillStyle = '#f2ead8'; c.beginPath(); c.moveTo(100, 395); c.lineTo(140, 395); c.lineTo(132, 312); c.lineTo(108, 312); c.fill();
  paperShadow(c, false); c.fillStyle = '#c8473a'; [[100,372,40],[104,342,32]].forEach(([x,y,w]) => c.fillRect(x + 2, y, w - 4, 12));
  paperShadow(c, true); c.fillStyle = '#2c3552'; c.fillRect(104, 296, 32, 16); c.beginPath(); c.moveTo(100, 296); c.lineTo(120, 276); c.lineTo(140, 296); c.fill();
  paperShadow(c, false); c.fillStyle = '#ffe9a0'; c.shadowColor = '#ffe9a0'; c.shadowBlur = 20; c.fillRect(112, 299, 16, 10); c.shadowBlur = 0;
  // dalgalar
  const cols = ['#33487a','#2a3d6c','#22335c','#1a294c','#13203d'];
  cols.forEach((col, i) => {
    const y0 = 470 + i*62, amp = 10 + i*3, sp = 0.8 + i*0.35;
    paperShadow(c, true); c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) c.lineTo(x, y0 + Math.sin(x*0.022 + t*sp + i)*amp + Math.sin(x*0.05 - t*sp*1.3)*4);
    c.lineTo(W, H); c.fill();
    if (i === 2){ // tekne
      const bx = 330 + Math.sin(t*0.6)*40, by = y0 + Math.sin(bx*0.022 + t*sp + i)*amp - 4, rot = Math.cos(bx*0.022 + t*sp + i)*0.2;
      c.save(); c.translate(bx, by); c.rotate(rot); c.fillStyle = '#5a3b2a'; c.beginPath(); c.moveTo(-26, 0); c.lineTo(26, 0); c.lineTo(18, 12); c.lineTo(-18, 12); c.fill();
      c.fillStyle = '#d94a3a'; c.beginPath(); c.moveTo(0, -2); c.lineTo(0, -44); c.lineTo(22, -6); c.fill(); c.fillStyle = '#f2ead8'; c.beginPath(); c.moveTo(-3, -4); c.lineTo(-3, -34); c.lineTo(-20, -6); c.fill(); c.restore();
    }
  });
  paperShadow(c, false);
  // kâğıt dokusu
  const rr = rng(3); c.fillStyle = 'rgba(255,255,255,.035)'; for (let i = 0; i < 400; i++) c.fillRect(rr()*W, rr()*H, 2, 2);
};

/* ---------- 3 3D Veri Grafiği ---------- */
R[2] = (c, t, lt) => {
  c.fillStyle = lin(c, 0, H, ['#1a212c','#121820','#0c1016']); c.fillRect(0,0,W,H);
  txt(c, 'Yıllara göre gelir', 34, 80, '800 26px Inter', '#fff');
  c.fillStyle = '#f0a35e'; c.fillRect(34, 98, 12, 12); txt(c, 'Gelir (milyon ₺)', 54, 109, '500 14px Inter', 'rgba(255,255,255,.6)');
  const base = 650, maxH = 420, vals = [1.2, 1.8, 2.6, 3.1, 4.4], yrs = ['2021','2022','2023','2024','2025'];
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1; for (let k = 0; k <= 4; k++){ const y = base - k*maxH/4; c.beginPath(); c.moveTo(30, y); c.lineTo(470, y); c.stroke(); }
  const dx = 16 + Math.sin(t*0.8)*4, dy = 10;
  vals.forEach((v, i) => {
    const g = ease((lt - i*0.1)/0.55); const h = Math.max(2, v/4.4*maxH*g), x = 44 + i*84, w = 56, y = base - h;
    // yan
    c.fillStyle = '#9a5a26'; c.beginPath(); c.moveTo(x+w, y); c.lineTo(x+w+dx, y-dy); c.lineTo(x+w+dx, base-dy); c.lineTo(x+w, base); c.fill();
    // ön
    const fg = c.createLinearGradient(x, 0, x+w, 0); fg.addColorStop(0, '#f6e7cc'); fg.addColorStop(1, '#e6cfa6'); c.fillStyle = fg; c.fillRect(x, y, w, h);
    c.fillStyle = 'rgba(240,163,94,.9)'; for (let yy = base - 14; yy > y + 4; yy -= 14) c.fillRect(x, yy, w, 3);
    // üst
    c.fillStyle = '#fff4df'; c.beginPath(); c.moveTo(x, y); c.lineTo(x+dx, y-dy); c.lineTo(x+w+dx, y-dy); c.lineTo(x+w, y); c.fill();
    c.globalAlpha = clamp((lt - i*0.1 - 0.35)/0.2, 0, 1);
    txt(c, (v*g).toFixed(1).replace('.', ',') + ' Mn', x + w/2 + 6, y - 22, '700 16px Inter', '#fff', 'center'); c.globalAlpha = 1;
    txt(c, yrs[i], x + w/2, base + 30, '500 14px JetBrains Mono', 'rgba(255,255,255,.55)', 'center');
  });
  // yansıma
  const rg = c.createLinearGradient(0, base, 0, H); rg.addColorStop(0, 'rgba(240,163,94,.12)'); rg.addColorStop(1, 'rgba(240,163,94,0)'); c.fillStyle = rg; c.fillRect(30, base + 40, 440, 120);
  const p = clamp((lt - 0.7)/0.4, 0, 1); c.globalAlpha = p; c.fillStyle = 'rgba(77,214,140,.15)'; c.beginPath(); c.roundRect(300, 730, 170, 40, 20); c.fill(); txt(c, '▲ %267 büyüme', 385, 756, '700 16px Inter', '#4dd68c', 'center'); c.globalAlpha = 1;
};

/* ---------- 4 Synthwave ---------- */
R[3] = (c, t, lt) => {
  const hz = 360;
  c.fillStyle = lin(c, 0, hz, ['#0d0020','#2a0750','#7a1a7e','#ff3cac']); c.fillRect(0,0,W,hz);
  c.fillStyle = '#08000f'; c.fillRect(0, hz, W, H - hz);
  const r = rng(9); c.fillStyle = '#fff'; for (let i = 0; i < 60; i++){ c.globalAlpha = .3 + .7*Math.abs(Math.sin(t*2 + i)); c.fillRect(r()*W, r()*220, 1.5, 1.5); } c.globalAlpha = 1;
  // güneş
  c.save(); c.beginPath(); c.arc(250, hz - 10, 120, 0, TAU); c.clip();
  const sg = c.createLinearGradient(0, hz - 130, 0, hz); sg.addColorStop(0, '#ffe66d'); sg.addColorStop(.5, '#ff9a3c'); sg.addColorStop(1, '#ff2e88'); c.fillStyle = sg; c.fillRect(120, hz - 140, 260, 140);
  c.fillStyle = '#7a1a7e'; for (let k = 0; k < 7; k++){ const y = hz - 70 + ((k*14 + t*16) % 98); c.fillRect(120, y, 260, 2 + (y - (hz - 70))*0.08); }
  c.restore();
  c.save(); c.shadowColor = '#ff3cac'; c.shadowBlur = 40; c.globalAlpha = .4; c.fillStyle = '#ff3cac'; c.beginPath(); c.arc(250, hz - 10, 122, Math.PI, 0); c.fill(); c.restore();
  // arazi

  const sp = document.createElement('span'); sp.innerHTML = `<b>${String(i+1).padStart(2,'0')}</b>${s}`; d.appendChild(sp);
  grid.appendChild(d); CELLS.push([d, tc.getContext('2d')]);
});

const BGS = (() => { const r = rng(2024), a = []; for (let i = 0; i < 220; i++) a.push([r()*1080, r()*1920, r()*1.8 + .3, r()*TAU, r()]); return a; })();
function drawBG(t){
  bctx.fillStyle = '#06070c'; bctx.fillRect(0,0,1080,1920);
  const g = bctx.createRadialGradient(540, 820, 0, 540, 820, 900); g.addColorStop(0, 'rgba(40,36,60,.55)'); g.addColorStop(1, 'rgba(6,7,12,0)'); bctx.fillStyle = g; bctx.fillRect(0,0,1080,1920);
  bctx.strokeStyle = 'rgba(255,255,255,.035)'; bctx.lineWidth = 2;
  [380, 520, 680].forEach((r,i) => { bctx.beginPath(); bctx.arc(540, 960, r + Math.sin(t*0.6 + i)*6, 0, TAU); bctx.stroke(); });
  BGS.forEach(([x,y,r,ph,sp]) => { bctx.globalAlpha = 0.15 + 0.6*Math.abs(Math.sin(t*(0.6 + sp) + ph)); bctx.fillStyle = '#fff'; bctx.beginPath(); bctx.arc(x, (y - t*6*sp + 1920) % 1920, r, 0, TAU); bctx.fill(); });
  bctx.globalAlpha = 1;
}

let lastTyped = '';
function renderAt(t){
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  const idx = clamp(Math.floor((t - S0)/D), 0, 8), lt = t - S0 - idx*D;
  drawBG(t);
  const k2 = easeIO((t - S2)/0.55);
  scene1.style.opacity = 1 - k2; scene1.style.transform = `translateY(${-40*k2}px)`;
  headA.style.opacity = 1 - clamp((t - S2)/0.3, 0, 1); headA.style.transform = `translateY(${-20*clamp((t - S2)/0.3, 0, 1)}px)`;
  headB.style.opacity = clamp((t - S2 - 0.15)/0.35, 0, 1); headB.style.transform = `translateY(${(1 - ease((t - S2 - 0.15)/0.5))*24}px)`;
  if (k2 < 1){
    items.forEach((el, i) => { const a = i === 0 ? 1 : ease((t - S0 - i*D + 0.05)/0.25); const tt = el.children[2]; tt.style.opacity = a; tt.style.transform = `translateX(${(1 - a)*-14}px)`; el.classList.toggle('on', i === idx); });
    phone.style.transform = `scale(${1 + 0.035*Math.max(0, 1 - lt/0.25)*(idx > 0 ? 1 : 0)})`;
    ctx.setTransform(2,0,0,2,0,0); ctx.textAlign = 'left';
    R[idx](ctx, t, lt);
    const fl = idx > 0 ? Math.max(0, 1 - lt/0.16) : 0; if (fl > 0){ ctx.fillStyle = `rgba(255,255,255,${fl*0.7})`; ctx.fillRect(0,0,W,H); }
    glow.style.background = `radial-gradient(closest-side, ${ACCENT[idx]}, transparent)`; glow.style.opacity = (0.4 + 0.1*Math.sin(t*3))*(1 - k2);
  }
  scene2.style.opacity = clamp((t - S2 - 0.2)/0.3, 0, 1);
  if (t >= S2){
    CELLS.forEach(([d, c], i) => {
      const a = back((t - S2 - 0.25 - i*0.06)/0.45); d.style.opacity = clamp(a, 0, 1); d.style.transform = `translateY(${(1 - a)*60}px) scale(${0.7 + 0.3*a})`;
      c.setTransform(0.8, 0, 0, 0.8, 0, -62); R[i](c, t, 3); c.setTransform(1,0,0,1,0,0);
    });
  }
  const word = 'STİLLER', cyc = t % 3.2;
  let n = cyc < 0.9 ? 0 : cyc < 1.7 ? Math.ceil((cyc - 0.9)/0.8*7) : 7; if (t < 0.9) n = 7;
  const s = word.slice(0, n); if (s !== lastTyped){ typed.textContent = s; lastTyped = s; }
  cursor.style.opacity = (Math.floor(t*2.4) % 2 === 0 || (cyc > 0.9 && cyc < 1.7)) ? 1 : 0;
  document.getElementById('pill').style.transform = `translateX(-50%) scale(${1 + 0.03*Math.max(0, 1 - Math.abs(cyc - 1.75)/0.2)})`;
}
window.renderAt = renderAt;
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
if (new URLSearchParams(location.search).has('capture')) stage.style.transform = 'none';
else { let t0 = null; const loop = now => { if (t0 === null) t0 = now; renderAt((now - t0)/1000); requestAnimationFrame(loop); }; document.fonts.ready.then(() => requestAnimationFrame(loop)); }
renderAt(0);
</script>
